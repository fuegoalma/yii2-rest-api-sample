services:
  web:
    build:
      context: .
      target: dev
    image: yii-app:dev
    env_file:
      - .env
    ports:
      - "8084:80"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yii-network

  # Runs scheduled console commands (see docker/cron/crontab). Reuses the web
  # image (same `image:` name → built once) and the same code mount + env, but
  # its entrypoint runs the cron daemon instead of Apache.
  cron:
    image: yii-app:dev
    build:
      context: .
      target: dev
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["sh", "/var/www/html/docker/cron/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yii-network

  # Long-running background worker: continuously processes queued jobs
  # (QueueController::actionListen → DbQueue). Reuses the web image (same
  # `image:` name → built once) + code mount + env; its entrypoint is the
  # worker loop instead of Apache, and it restarts so it stays up.
  worker:
    image: yii-app:dev
    build:
      context: .
      target: dev
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["php", "yii", "queue/listen"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yii-network

  db:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      # Falls back to DB_PASSWORD so an .env written before DB_ROOT_PASSWORD
      # existed keeps working; new ones set it explicitly (see .env.example).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    # Without this the other services' `depends_on` only waits for the container
    # to *start*, which for MySQL is several seconds before it accepts a
    # connection — so `make up` raced the database on every cold boot.
    # `$$` reaches the container's own environment rather than being substituted
    # by Compose, so the credentials come from MYSQL_ROOT_PASSWORD above and are
    # never spelled out here.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - yii-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      PMA_USER: 
      PMA_PASSWORD: 
      UPLOAD_LIMIT: 100M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yii-network

networks:
  yii-network:

volumes:
  db-data: