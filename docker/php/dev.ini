; Development overrides, applied only by the `dev` stage.

; php.ini-production silences these. Locally the opposite is wanted: a fatal
; that escapes Yii's error handler should be visible in the response, not only
; in the log.
display_errors = On
display_startup_errors = On

; Code is bind-mounted, so opcache has to notice edits. This is the default,
; stated explicitly because the prod stage turns it off and the pair only makes
; sense read together.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
