; Settings shared by every stage, layered on top of php.ini-production.
;
; The official php image ships no php.ini at all, so before this the runtime ran
; on PHP's compiled-in defaults — display_errors among them. The base stage now
; installs php.ini-production and this file adjusts what the application needs.

; An API that answers in JSON has no reason to name its runtime in a header.
expose_php = Off

; Imagick decodes an upload into a bitmap before scaling it, which needs more
; headroom than a JSON request. The real defence against an oversized decode is
; ImagickWebpEncoder's own resource limits, not this number.
memory_limit = 256M

; Uploads are capped in three places that have to agree: here, the
; `photo_max_upload_bytes` param that PhotoCreateForm validates against, and the
; limit published in config/openapi.yaml. post_max_size sits above
; upload_max_filesize to leave room for the other multipart fields — when a body
; exceeds it PHP discards the whole thing, which the application turns into a
; 413 rather than a confusing "title is required".
upload_max_filesize = 10M
post_max_size = 12M
