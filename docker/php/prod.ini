; Production overrides, applied only by the `prod` stage.

; The application code is baked into the image and cannot change while the
; container runs, so there is nothing for opcache to revalidate: this drops a
; stat() per included file per request. It is also why the setting cannot move
; up into the shared base — under the dev bind mount it would serve stale code
; until the container restarted.
opcache.validate_timestamps = 0

; Yii plus the application is a few thousand files; the defaults are sized for a
; smaller tree and start evicting.
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Path resolution is repeated on every autoload; with immutable code the cache
; can be large and long-lived.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
