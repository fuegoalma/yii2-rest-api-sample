name: CI

on:
  # A branch with an open pull request would otherwise be built twice for the
  # same commit — once by `push`, once by `pull_request`. Pushes are therefore
  # narrowed to the branch CD chains off; every other branch is covered by its
  # pull request.
  push:
    branches: [master]
  pull_request:

# Superseded runs on the same ref are pointless — except on master, where CD
# picks up the completed run via `workflow_run` and cancelling one would drop
# the deploy with it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    name: cs-fixer · phpstan · tests · coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: yii2_test
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: yii2_test
      BASE_URL: http://localhost:8084
      DEFAULT_PASSWORD: '123456'
      COOKIE_VALIDATION_KEY: ci-cookie-validation-key-change-me
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_TTL: '3600'
      LOGIN_RATE_LIMIT_ATTEMPTS: '5'
      LOGIN_RATE_LIMIT_WINDOW: '60'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: imagick, pdo_mysql, mysqli, pcntl
          # pcov backs the 100% coverage gate below. The Dockerfile `base` stage
          # installs the same driver for local `make coverage` — keep them in step.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # --- supply chain: what ships has to be clean before anything else runs ---
      # Keep in step with `make audit`. The full picture (dev tooling, secret
      # scan, weekly cron) is .github/workflows/security.yml.
      - name: Audit runtime dependencies
        run: composer audit --locked --no-dev --no-interaction

      # --- static gates first: fast feedback, no database needed ---
      - name: Code style (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # --- tests: migrate the test DB, then run the suite ---
      - name: Run migrations
        run: php yii migrate-test/up --interactive=0

      # Both suites must run in ONE process: coverage is merged across suites at
      # the end of the run, so a split would have the second overwrite the first.
      # This replaces a plain `codecept run` — the pass/fail signal is identical,
      # and running the suite twice would only double the wall clock.
      # pcov.enabled/directory are pinned here rather than trusted to whatever
      # setup-php's `coverage: pcov` leaves in the ini — without an enabled
      # driver Codeception aborts with "No code coverage driver available".
      # Keep this invocation in step with the `coverage` target in the Makefile.
      - name: Run tests with coverage
        run: |
          php -d pcov.enabled=1 \
              -d pcov.directory="$GITHUB_WORKSPACE" \
              -d pcov.exclude='~/(vendor|tests)/~' \
              vendor/bin/codecept run \
              --coverage --coverage-xml --coverage-html --coverage-text \
              --disable-coverage-php

      - name: Enforce 100% coverage
        run: php tests/bin/coverage-check.php tests/_output/coverage.xml

      # The HTML report gives the same per-file drill-down as locally. Uploaded
      # on a green run too: a gate that passes at exactly 100% is the run you
      # most want the report from when the next commit drops below it.
      # Line coverage says a line ran; this says the suite would notice if it were
      # wrong. Threshold lives in infection.json5 — keep `make mutation` in step.
      - name: Mutation testing (Infection)
        run: |
          vendor/bin/infection --threads=4 --no-progress --no-interaction \
              --initial-tests-php-options="-d pcov.enabled=1 -d pcov.directory=$GITHUB_WORKSPACE"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: tests/_output/coverage/
          retention-days: 7
          # the report is absent when the run itself failed before writing it —
          # don't turn that into a second, misleading failure
          if-no-files-found: ignore
