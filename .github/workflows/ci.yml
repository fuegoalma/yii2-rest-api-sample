name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: cs-fixer · phpstan · tests · coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: yii2_test
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: yii2_test
      BASE_URL: http://localhost:8084
      DEFAULT_PASSWORD: '123456'
      COOKIE_VALIDATION_KEY: ci-cookie-validation-key-change-me
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_TTL: '3600'
      LOGIN_RATE_LIMIT_ATTEMPTS: '5'
      LOGIN_RATE_LIMIT_WINDOW: '60'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: imagick, pdo_mysql, mysqli, pcntl
          # pcov backs the 100% coverage gate below. The Dockerfile `base` stage
          # installs the same driver for local `make coverage` — keep them in step.
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # --- static gates first: fast feedback, no database needed ---
      - name: Code style (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # --- tests: migrate the test DB, then run the suite ---
      - name: Run migrations
        run: php yii migrate-test/up --interactive=0

      # Both suites must run in ONE process: coverage is merged across suites at
      # the end of the run, so a split would have the second overwrite the first.
      # This replaces a plain `codecept run` — the pass/fail signal is identical,
      # and running the suite twice would only double the wall clock.
      - name: Run tests with coverage
        run: |
          php -d pcov.directory="$GITHUB_WORKSPACE" \
              -d pcov.exclude='~/(vendor|tests)/~' \
              vendor/bin/codecept run \
              --coverage --coverage-xml --coverage-html --coverage-text \
              --disable-coverage-php

      - name: Enforce 100% coverage
        run: php tests/bin/coverage-check.php tests/_output/coverage.xml

      # On a red gate, the HTML report gives the same per-file drill-down locally
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: tests/_output/coverage/
          retention-days: 7
